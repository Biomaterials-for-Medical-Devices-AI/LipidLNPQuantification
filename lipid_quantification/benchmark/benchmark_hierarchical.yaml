data:
  train_csv: "datasets/meassurements/ion_normalised/microarray_271225.csv"
  remove_feats: []
  test_csv: "datasets/meassurements/ion_normalised/microarray_300126.csv"
  profile_csv: "datasets/profile/ion_normalised/profile.csv"
  curve_txt: "datasets/instrument/VAMAS_Instrument.txt"
  n_targets: 4
  dropna_test: true

scaling:
  instrument: ["wsor", "log10", "none"]
  experiment: ["minmax", "standard", "none"]
  local: [true, false]

model:
  kind: hierarchical   # or "flat"
  components: ["SM102", "DMGPEG", "DSPC", "Cholesterol"]
  subcomponents:
    DMGPEG: ["DMG", "PEG"]
  leaf_features:
    SM102: [C_44H_86NO_5+]
    DSPC: [C_5H_15PNO_4+, C_20H_39O_2+]
    Cholesterol: [C_27H_43+, C_27H_45+, C_27H_45O+]
    DMG: [C_14H_27O_2+, C_16H_31O_2+]
    PEG: [C_24H_48O_13Na+, C_45H_90O_22Na+]

tuning:
  enabled: false
  n_trials: 10

training:
  random_state: [42, 43, 44, 45, 46]
  device: "auto"
  test_size: 0.2
  val_size: 0.2
  epochs: 300
  patience: 25
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  target_names: ["SM102", "DMGPEG", "DSPC", "Cholesterol"]

baseline:
  shuffle_targets: false

paths:
  runs: benchmarks_hierarchical
  benchmark: root

plotting:
  parity:
    markers: ["o", "s", "^", "D"]
    colors:
      SM102: "#1fa9a3"
      DMGPEG: "#e46c19"
      DSPC: "#8e73c7"
      Cholesterol: "#5fb13d"