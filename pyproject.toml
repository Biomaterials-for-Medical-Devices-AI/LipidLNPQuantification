[project]
name = "lipidlnpquantification"
version = "0.1.0"
description = "Machine-learning calibration for quantitative lipid composition in lipid nanoparticles."
authors = [
    {name = "Eduardo Aguilar",email = "ed.aguilar.bejarano@gmail.com"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = "~3.11"
dependencies = [
    "pandas (>=2.2.3,<3.0.0)",
    "numpy (>=1.26.4,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "torch (==2.8.0) ; python_version < \"3.14\"",
    "pyyaml (>=6.0.3,<7.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "captum (>=0.8.0,<0.9.0)",
    "scipy (>=1.17.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
